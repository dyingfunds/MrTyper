<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="70" y1="20" x2="450" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111731"/>
      <stop offset="0.48" stop-color="#171332"/>
      <stop offset="1" stop-color="#0a0b18"/>
