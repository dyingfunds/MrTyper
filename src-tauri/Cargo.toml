[package]
name = "mrtyper"
version = "1.0.0"
description = "Human-paced typing into any Windows window"
authors = ["MrTyper"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "mrtyper_lib"
# Desktop-only application: the binary links the library as an rlib. Keeping
# mobile crate types here would make MinGW builds export an oversized DLL.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.5"
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
