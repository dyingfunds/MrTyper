# Builds and tests MrTyper for every platform on real machines.
#
# Windows   -> repository root           -> NSIS installer
# Linux     -> MrTyper-ArchLinux/        -> AppImage, .deb, .rpm (Ubuntu runner)
# Arch      -> MrTyper-ArchLinux/        -> .pkg.tar.zst via the PKGBUILD (Arch container)
# macOS     -> MrTyper-macOS/            -> universal .app and .dmg
#
# Download the results from the run's "Artifacts" section.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.15.0"
  NODE_VERSION: "22"

jobs:
  sync:
    name: Platform sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The macOS and Linux apps must match the root (Windows) app except for
      # their platform-specific files. See scripts/check-platform-sync.mjs.
      - run: node scripts/check-platform-sync.mjs

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: MrTyper-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux (AppImage, deb, rpm)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: MrTyper-ArchLinux
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxkbcommon-dev libssl-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: MrTyper-ArchLinux/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MrTyper-ArchLinux/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: MrTyper-Linux
          path: |
            MrTyper-ArchLinux/src-tauri/target/release/bundle/appimage/*.AppImage
            MrTyper-ArchLinux/src-tauri/target/release/bundle/deb/*.deb
            MrTyper-ArchLinux/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  arch:
    name: Arch Linux (makepkg)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        # Arch mirrors occasionally fail mid-sync, so retry before giving up.
        run: |
          for attempt in 1 2 3; do
            if pacman -Syu --noconfirm --needed --disable-download-timeout \
                base-devel git rust nodejs pnpm \
                webkit2gtk-4.1 gtk3 libayatana-appindicator libxkbcommon hicolor-icon-theme; then
              exit 0
            fi
            echo "::warning::pacman failed (attempt $attempt of 3); retrying in 20 seconds"
            sleep 20
          done
          echo "::error::Could not install the Arch build dependencies after 3 attempts"
          exit 1
      - uses: actions/checkout@v4
      - name: Build the package with makepkg
        # makepkg refuses to run as root, so build as an unprivileged user.
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/MrTyper-ArchLinux/packaging/arch' && makepkg --noconfirm"
      - name: Inspect the package
        run: pacman -Qlp MrTyper-ArchLinux/packaging/arch/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: MrTyper-ArchLinux
          path: MrTyper-ArchLinux/packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: MrTyper-macOS
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: MrTyper-macOS/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MrTyper-macOS/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri:build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: MrTyper-macOS
          path: |
            MrTyper-macOS/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Pushing a version tag (for example `git push origin v2.0.0`) publishes
  # every installer above as a GitHub Release that anyone can download.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sync, windows, linux, arch, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers and checksums
        run: |
          mkdir installers
          find artifacts -type f -exec mv {} installers/ \;
          cd installers
          sha256sum * > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: MrTyper ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: installers/*
          fail_on_unmatched_files: true
