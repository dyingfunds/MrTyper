[package]
name = "mrtyper"
version = "2.1.0"
description = "Human-paced typing into any macOS app"
authors = ["MrTyper"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "mrtyper_lib"
# Desktop-only application: the binary links the library as an rlib. Keeping
# mobile crate types here would make MinGW builds export an oversized DLL.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Posts CGEvent keystrokes and handles the Accessibility permission prompt.
enigo = "0.6"
# Frontmost-application lookup for the focus guard. Same versions Tauri uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSWorkspace",
  "NSRunningApplication",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
